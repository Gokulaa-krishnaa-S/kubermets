swagger: "2.0"
info:
  title: Kubernetes Metrics Explorer
  description: Flask API for monitoring Kubernetes costs via Kubecost, with background job support.
  version: "1.0.0"
host: localhost:5000
basePath: /
schemes:
  - http
tags:
  - name: system
    description: System and monitoring endpoints
  - name: metrics
    description: Kubernetes cost and resource metrics

paths:
  /api/health:
    get:
      tags:
        - system
      summary: Check the health status of database and Kubecost API
      responses:
        200:
          description: Healthy status
          schema:
            type: object
            properties:
              status:
                type: string
              timestamp:
                type: string
              services:
                type: object
                properties:
                  database:
                    type: string
                  kubecost_api:
                    type: string
              background_tasks:
                type: object
                properties:
                  enabled:
                    type: boolean
                  refresh_interval_minutes:
                    type: integer
                  data_retention_days:
                    type: integer
        503:
          description: Unhealthy status

  /api/info:
    get:
      tags:
        - system
      summary: Provides API metadata and available endpoints
      responses:
        200:
          description: API information
          schema:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
              description:
                type: string
              endpoints:
                type: object
                additionalProperties:
                  type: string
              documentation:
                type: string

  /v1/clusters/status:
    get:
      tags:
        - metrics
      summary: Get status of clusters
      responses:
        200:
          description: Cluster status response
          schema:
            type: object

  /v1/all:
    get:
      tags:
        - metrics
      summary: Get combined metrics data
      responses:
        200:
          description: All metrics response
          schema:
            type: object

  /v1/get_pod_details:
    get:
      tags:
        - metrics
      summary: Get details of running pods
      responses:
        200:
          description: Pod details response
          schema:
            type: object

  /v1/clusters/nodes:
    get:
      tags:
        - metrics
      summary: Get cluster node information
      responses:
        200:
          description: Node info response
          schema:
            type: object

  /v1/dashboard/summary:
    get:
      tags:
        - metrics
      summary: Get summary dashboard data
      responses:
        200:
          description: Dashboard summary response
          schema:
            type: object

  /v1/cache/status:
    get:
      tags:
        - metrics
      summary: Get cache status info
      responses:
        200:
          description: Cache status
          schema:
            type: object
